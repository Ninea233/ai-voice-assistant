# AI 语音助手主配置文件

[audio]
capture_device = default
playback_device = default
sample_rate = 16000
channels = 1
format = S16_LE
period_size = 320
# 单轮对话内静默超时 2s（检测用户说完一句话）
vad_silence_timeout_ms = 2000
# 唤醒周期内总静默超时 10s（用户不说话则自动休眠）
vad_conversation_timeout_ms = 10000
vad_min_speech_ms = 200

[kws]
model_path = models/kws_model.tflite
threshold = 0.97
wakeword = 小九小九

# ========== 云服务（讯飞平台） ==========

# 公共凭证（ASR/LTTS 共用）
[cloud]
app_id = your_app_id
api_key = your_api_key
api_secret = your_api_secret

# ===== ASR 配置（多引擎模型表决） =====
[asr]
# 主引擎：讯飞中文识别大模型
main_url = wss://iat-api.xfyun.cn/v2/iat
# 中文识别大模型资源 ID（讯飞 Spark iAT 大模型专用）
res_id = your_res_id
# 方言引擎：讯飞方言识别大模型
dialect_enabled = false
dialect_url = wss://iat-api.xfyun.cn/v2/iat
# 模型表决策略：confidence（置信度加权）| majority（多数投票）
voting_strategy = confidence

# ===== LLM 配置 =====
[llm]
provider = xfyun_star
api_key = your_llm_api_key
api_url = https://spark-api-open.xf-yun.com/agent/v1/chat/completions
model = spark-x

# ===== TTS 配置 =====
[tts]
provider = xfyun
url = wss://cbm01.cn-huabei-1.xf-yun.com/v1/private/mcd9m97e6
auth = your_tts_auth_token

# 默认音色（可选：xiaoyan, aisjping, aisjying 等）
voice = x6_lingyuyan_pro

[memory]
memory_dir = memory
auto_save = true
max_history_entries = 100

[agent]
# Agent 全局 Prompt 文件（不可改动区 + 可改动区）
prompt_path = config/agent_prompt.md
# Action 配置文件（keyword + LLM 触发，直接执行）
actions_path = config/actions.json
# Skill 目录（SKILL.md 文件，仅 LLM 触发，必回注）
skills_dir = skills
# MCP 工具配置文件（JSON-RPC 2.0 标准）
mcp_tools_path = config/mcp_tools.json
# 唤醒提示音文件（用户提供）
wakeup_sound = config/wakeup.wav
# 工具调用最大轮数
max_tool_rounds = 3

[ir]
simulated = true

[system]
# 调试模式：true=详细日志+保存中间文件，false=只输出关键信息
debug_mode = false
# 网络不可用时回退到模拟响应
enable_local_fallback = true
